<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>Reset your password | Derma Insight</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="auth-shell" data-recovery-mode="request">
  <main class="auth-card" aria-labelledby="recovery-title">
    <div class="branding">
      <div class="brand-mark">DI</div>
      <div><span class="eyebrow">Merchant portal</span><h1 id="recovery-title">Forgot your password?</h1></div>
    </div>
    <p class="auth-subtitle">Enter your account email to request a password-reset link. Links expire after 15 minutes. If you request more than one, use the newest email.</p>
    <form id="recoveryForm" class="form-stack" aria-busy="true" novalidate>
      <fieldset id="recoveryFields" disabled style="border:0;padding:0;margin:0;min-width:0;display:grid;gap:16px">
        <legend>Account email</legend>
        <div class="form-field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" maxlength="254" autocomplete="email" required />
        </div>
        <button class="btn btn-primary" id="recoverySubmit" type="submit">Send reset link</button>
      </fieldset>
    </form>
    <p id="recoveryStatus" class="message" role="status" aria-live="polite">Checking password recovery…</p>
    <div class="auth-meta"><a class="auth-link" href="./index.html">Back to sign in</a></div>
  </main>
  <script src="./js/password-recovery.js"></script>
</body>
</html>
