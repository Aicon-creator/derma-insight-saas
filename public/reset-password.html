<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>Choose a new password | Derma Insight</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="auth-shell" data-recovery-mode="reset">
  <main class="auth-card" aria-labelledby="recovery-title">
    <div class="branding">
      <div class="brand-mark">DI</div>
      <div><span class="eyebrow">Merchant portal</span><h1 id="recovery-title">Choose a new password</h1></div>
    </div>
    <p id="passwordHelp" class="auth-subtitle">Use at least 8 characters, up to 72 UTF-8 bytes. All previous sign-in sessions for this account will expire after the change.</p>
    <form id="recoveryForm" class="form-stack" aria-describedby="passwordHelp" aria-busy="true" novalidate>
      <fieldset id="recoveryFields" disabled style="border:0;padding:0;margin:0;min-width:0;display:grid;gap:16px">
        <legend>New password</legend>
        <div class="form-field">
          <label for="password">New password</label>
          <input id="password" name="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required />
        </div>
        <div class="form-field">
          <label for="confirmPassword">Confirm new password</label>
          <input id="confirmPassword" name="confirmPassword" type="password" minlength="8" maxlength="72" autocomplete="new-password" required />
        </div>
        <button class="btn btn-primary" id="recoverySubmit" type="submit">Change password</button>
      </fieldset>
    </form>
    <p id="recoveryStatus" class="message" role="status" aria-live="polite">Checking password recovery…</p>
    <div class="auth-meta"><a class="auth-link" href="./forgot-password.html">Request a new link</a></div>
    <div class="auth-meta"><a class="auth-link" href="./index.html">Back to sign in</a></div>
  </main>
  <script src="./js/password-recovery.js"></script>
</body>
</html>
