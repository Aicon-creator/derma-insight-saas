<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Settings - Derma Insight</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body data-di-active-nav="settings">
    <div class="dashboard-layout">
      <aside class="sidebar" data-di-sidebar></aside>

      <main class="main-content">
        <header class="topbar">
          <div class="topbar-copy">
            <button id="sidebarToggle" class="sidebar-toggle" aria-label="Toggle sidebar" title="Toggle sidebar">
              <span class="bar"></span>
              <span class="bar"></span>
              <span class="bar"></span>
            </button>

            <div class="breadcrumbs">
              <h1>Settings</h1>
            </div>
            <p class="topbar-sub">Business profile and branding</p>
          </div>

          <div class="topbar-actions">
            <div class="merchant-profile" id="merchantProfile" aria-haspopup="true">
              <button id="merchantBtn" class="merchant-btn" aria-expanded="false">
                <span class="avatar" id="merchantAvatar">DI</span>
                <span class="merchant-name" id="merchantName">Merchant</span>
                <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>

              <div class="merchant-menu hidden" id="merchantMenu" role="menu">
                <a href="./settings.html" class="menu-item" role="menuitem">Settings</a>
                <button class="menu-item" id="logoutBtnSmall" role="menuitem">Logout</button>
              </div>
            </div>
          </div>
        </header>

        <section class="card" style="max-width:640px">
          <h3>Business profile</h3>
          <form id="settingsForm">
            <label for="businessName">Business name</label>
            <input id="businessName" name="businessName" type="text" required />

            <label for="logoInput">Logo (optional)</label>
            <input id="logoInput" type="file" accept="image/*" />
            <div id="logoPreview" style="margin-top:8px"></div>

            <div style="margin-top:12px">
              <button class="btn btn-primary" id="saveSettings">Save</button>
              <button class="btn btn-secondary" id="cancelSettings" type="button">Cancel</button>
            </div>

            <p class="muted" style="margin-top:8px">Note: Settings are saved locally in the browser for demo purposes.</p>
          </form>
        </section>
      </main>
    </div>

    <script src="./js/auth.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/layout.js"></script>
    <script src="./js/settings.js"></script>
  </body>
</html>
