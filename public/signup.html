<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account | Derma Insight</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body class="auth-shell">
    <header class="topbar auth-topbar">
      <div class="topbar-copy">
        <div class="brand-mark small">DI</div>
        <div class="breadcrumbs"><h1>Derma Insight</h1></div>
      </div>
      <div class="topbar-actions">
        <div class="merchant-profile" id="merchantProfile">
          <button id="merchantBtn" class="merchant-btn" aria-expanded="false">
            <span class="avatar" id="merchantAvatar">DI</span>
            <span class="merchant-name" id="merchantName">Merchant</span>
          </button>
          <div class="merchant-menu hidden" id="merchantMenu" role="menu">
            <a href="./settings.html" class="menu-item" role="menuitem">Settings</a>
            <button class="menu-item" id="logoutBtnSmall" role="menuitem">Logout</button>
          </div>
        </div>
      </div>
    </header>

    <main class="auth-card" aria-labelledby="signup-title">
      <div class="branding">
        <div class="brand-mark">DI</div>
        <div>
          <span class="eyebrow">New merchant</span>
          <h1 id="signup-title">Create account</h1>
        </div>
      </div>

      <p class="auth-intro">Start using Derma Insight to understand your skincare business.</p>

      <form id="signupForm" class="form-stack" novalidate>
        <div class="form-field">
          <label for="businessName">Business name</label>
          <input type="text" id="businessName" name="businessName" placeholder="Glow Beauty Studio" required />
        </div>

        <div class="form-field">
          <label for="ownerName">Owner name</label>
          <input type="text" id="ownerName" name="ownerName" placeholder="Tosin Mautin" required />
        </div>

        <div class="form-field">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="owner@example.com" autocomplete="email" required />
        </div>

        <div class="form-field">
          <label for="platformType">Platform type</label>
          <select id="platformType" name="platformType" required>
            <option value="custom">Custom store</option>
            <option value="shopify">Shopify store</option>
          </select>
        </div>

        <div class="form-field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Minimum 8 characters" autocomplete="new-password" required />
        </div>

        <div class="form-field">
          <label for="confirmPassword">Confirm password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repeat password" autocomplete="new-password" required />
        </div>

        <button type="submit" id="signupBtn" class="btn btn-primary">Create account</button>
        <div id="signupMessage" class="message" aria-live="polite"></div>
      </form>

      <div class="auth-meta">
        <span>Already have an account?</span>
        <a href="./index.html" class="auth-link">Sign in</a>
      </div>
    </main>

    <script src="./js/api.js"></script>
    <script src="./js/layout.js"></script>
    <script src="./js/signup.js"></script>
  </body>
</html>
