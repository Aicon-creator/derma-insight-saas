<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Derma Insight SaaS - Merchant Login</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="auth-shell">
<header class="topbar auth-topbar">
  <div class="topbar-copy">
    <div class="brand-mark small">DI</div>
    <div class="breadcrumbs"><h1>Derma Insight</h1></div>
  </div>
  <div class="topbar-actions">
    <div class="merchant-profile" id="merchantProfile">
      <button id="merchantBtn" class="merchant-btn" aria-expanded="false">
        <span class="avatar" id="merchantAvatar">DI</span>
        <span class="merchant-name" id="merchantName">Merchant</span>
      </button>
      <div class="merchant-menu hidden" id="merchantMenu" role="menu">
        <a href="./settings.html" class="menu-item" role="menuitem">Settings</a>
        <button class="menu-item" id="logoutBtnSmall" role="menuitem">Logout</button>
      </div>
    </div>
  </div>
</header>

<main class="auth-card" aria-labelledby="login-title">
    <div class="branding">
      <div class="brand-mark">DI</div>
      <div>
        <span class="eyebrow">Merchant portal</span>
        <h1 id="login-title">Derma Insight SaaS</h1>
      </div>
    </div>

    <p class="auth-subtitle">Sign in to your skincare intelligence dashboard.</p>

    <form id="loginForm" class="form-stack" novalidate>
      <div class="form-field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="name@business.com" autocomplete="email" required />
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required />
      </div>

      <button type="submit" class="btn btn-primary">Sign in</button>
    </form>

    <div class="auth-meta">
      <span>Need an account?</span>
      <a href="./signup.html" class="auth-link">Create one</a>
    </div>

    <p id="message" class="message" aria-live="polite"></p>
  </main>

  <script src="./js/api.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/layout.js"></script>
  <script src="./js/login.js"></script>
</body>
</html>
